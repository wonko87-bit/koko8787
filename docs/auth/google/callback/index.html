<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskBridge</title>
<style>
  body { font-family: sans-serif; display: flex; justify-content: center;
         align-items: center; height: 100vh; margin: 0; background: #1a1d27; color: #fff; }
  p { font-size: 16px; }
</style>
</head>
<body>
<p>앱으로 돌아가는 중...</p>
<script>
  var p = new URLSearchParams(window.location.search);
  var code  = p.get('code')  || '';
  var state = p.get('state') || '';
  var error = p.get('error') || '';
  var url = error
    ? 'taskbridge://auth/google?error=' + encodeURIComponent(error)
    : 'taskbridge://auth/google?code='  + encodeURIComponent(code) + '&state=' + encodeURIComponent(state);
  window.location.replace(url);
</script>
</body>
</html>
