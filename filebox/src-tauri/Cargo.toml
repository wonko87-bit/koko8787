[package]
name = "filebox"
version = "0.1.0"
description = "새 파일을 자동 수집하고 가상 분류한 뒤, 즐겨찾기 폴더로 원클릭 이동하는 Windows 파일 관리함"
authors = ["koko8787"]
edition = "2021"

[lib]
name = "filebox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
