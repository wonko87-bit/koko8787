[package]
name = "filebox"
version = "0.2.5"
description = "새 파일을 자동 수집하고 가상 분류한 뒤, 즐겨찾기 폴더로 원클릭 이동하는 Windows 파일 관리함"
authors = ["koko8787"]
edition = "2021"

[lib]
name = "filebox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
trash = "5"
uuid = { version = "1", features = ["v4", "v5", "macro-diagnostics"] }
# 기한 계산과 로컬 벽시계 표기. Flowdeck 이 시간대 없는 값을 기대한다.
chrono = "0.4"

[dev-dependencies]
# 목 앱으로 커맨드 배선을 그대로 돌려 보기 위한 것. 발송 로직만 따로 검증하면
# "이동 명령이 그 로직을 부르는가" 라는 정작 중요한 부분이 빠진다.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
