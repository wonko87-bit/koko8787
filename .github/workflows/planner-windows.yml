name: Planner Windows Build

on:
  push:
    branches: ["main", "claude/planner**"]
    paths: ["planner/**", ".github/workflows/planner-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_SECRETS: ${{ secrets.PLANNER_GOOGLE_CLIENT_ID != '' && secrets.PLANNER_GOOGLE_CLIENT_SECRET != '' }}
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: planner/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: planner/src-tauri

      - name: Install Tauri CLI
        run: npm ci

      - name: Check frontend syntax
        run: |
          node --check src/app.js
          node --check src/holidays.js
          node --check src/sync.js

      - name: Sync engine tests
        run: node --test tests/sync.test.js

      - name: Run Rust tests
        run: cargo test --release
        working-directory: planner/src-tauri

      # ① 회사 PC용: 동기화 없음 (OAuth 시크릿 없이 빌드)
      - name: Build local-only installer
        run: npx tauri build

      - name: Collect local-only artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/local | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_ ("out/local/" + $_.BaseName + "_local.exe") }
          Copy-Item src-tauri/target/release/planner.exe out/local/Planner-local-portable.exe

      # ② 개인용: Google 드라이브 동기화 포함 (저장소 시크릿 주입)
      - name: Build sync-enabled installer
        if: ${{ env.HAS_SECRETS == 'true' }}
        env:
          PLANNER_GOOGLE_CLIENT_ID: ${{ secrets.PLANNER_GOOGLE_CLIENT_ID }}
          PLANNER_GOOGLE_CLIENT_SECRET: ${{ secrets.PLANNER_GOOGLE_CLIENT_SECRET }}
        run: npx tauri build

      - name: Collect sync-enabled artifacts
        if: ${{ env.HAS_SECRETS == 'true' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/sync | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_ ("out/sync/" + $_.BaseName + "_sync.exe") }
          Copy-Item src-tauri/target/release/planner.exe out/sync/Planner-sync-portable.exe
          Get-ChildItem out -Recurse | Format-Table FullName, Length

      - name: Upload local-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: Planner-windows-local
          path: planner/out/local/*.exe
          if-no-files-found: error

      - name: Upload sync-enabled artifact
        if: ${{ env.HAS_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Planner-windows-sync
          path: planner/out/sync/*.exe
          if-no-files-found: error
