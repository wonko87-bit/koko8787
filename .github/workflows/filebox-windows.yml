name: FileBox Windows Build

on:
  push:
    branches: ["main", "claude/windows-file-manager-app-b38rvf"]
    paths: ["filebox/**", ".github/workflows/filebox-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: filebox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: filebox/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: filebox/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test
        working-directory: filebox/src-tauri

      - name: Build Windows installer (NSIS)
        run: npm run tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileBox-windows-installer
          path: filebox/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
