name: Flowdeck (Android)

# The MAUI app can only be built where the android workload is installable, so this
# workflow is where the phone app is actually compiled.
#
# Kept out of Flowdeck.sln on purpose: the Windows workflow builds that solution, and a
# project it cannot restore would take the desktop build down with it.
on:
  push:
    branches: ["**"]
    paths:
      - "flowdeck/**"
      - ".github/workflows/flowdeck-android.yml"
  pull_request:
    paths:
      - "flowdeck/**"
      - ".github/workflows/flowdeck-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed to keep the download release up to date.
    permissions:
      contents: write

    defaults:
      run:
        working-directory: flowdeck

    steps:
      - uses: actions/checkout@v4

      # The android workload is only published for supported bands, and net8.0-android
      # is no longer one of them, so the app targets the SDK the runner already carries.
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the android workload
        run: dotnet workload install maui-android --skip-sign-check

      - name: Publish
        run: >
          dotnet publish src/Flowdeck.Mobile/Flowdeck.Mobile.csproj
          --configuration Release
          --framework net10.0-android
          --output publish-android

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: flowdeck-android
          path: flowdeck/publish-android/*.apk
          if-no-files-found: error

      # An artifact is a zip behind a login, which a phone handles badly — and a phone is
      # the only thing that can install this. A release asset is the bare .apk on a stable
      # URL, so installing means opening one link and tapping the file.
      - name: Publish the apk where a phone can reach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The build leaves two .apk files side by side and only the signed one can be
          # installed — Android refuses a package with no certificate. Picking the first
          # by name happened to work, but which one that is depends on the runner's
          # collation, so name it outright and fail loudly if it is not there.
          apk="$(ls publish-android/*-Signed.apk | head -1)"
          cp "$apk" flowdeck.apk
          unzip -l flowdeck.apk | grep -qE 'META-INF/.*\.(RSA|DSA|EC)$' \
            || { echo "::error::the apk carries no signature and could not be installed"; exit 1; }

          gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Flowdeck Android — 최신 빌드" \
              --notes "설치용 APK입니다."

          gh release upload android-latest flowdeck.apk --repo "$GITHUB_REPOSITORY" --clobber

          gh release edit android-latest --repo "$GITHUB_REPOSITORY" --notes \
            "폰에서 아래 **flowdeck.apk** 를 받아 실행하면 설치됩니다.

          빌드: \`${GITHUB_SHA:0:7}\` · 브랜치 \`${GITHUB_REF_NAME}\`

          스토어를 거치지 않은 앱이라 처음 설치할 때 *출처를 알 수 없는 앱* 허용을 한 번 물어봅니다."
